<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS. Hà Hiếu · Thẩm mỹ & Kiến thức</title>
<meta name="description" content="Kiến thức thẩm mỹ, bảng giá dịch vụ và tư vấn từ BS. Hà Hiếu, bác sĩ ngoại khoa chuyên ngành phẫu thuật tạo hình thẩm mỹ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: thanh trên cố định; khu công khai thoáng, khu tính tiền dạng bảng điều khiển. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#eef3f3; --ink:#15242a; --muted:#5b6d74; --line:#d9e3e5;
  --accent:#0d6870; --accent-ink:#ffffff; --accent-soft:#dfeff0;
  --good:#1d7548; --good-soft:#e2f3ea; --warn:#a96300; --warn-soft:#fbefdc; --bad:#b0281f; --bad-soft:#fbe5e3;
  --font-display:'Lexend','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(15,40,45,.06),0 4px 14px rgba(15,40,45,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152124; --surface-2:#1b2a2e; --ink:#e4edef; --muted:#93a7ad; --line:#26383c;
  --accent:#5fc2ca; --accent-ink:#06282b; --accent-soft:#17363a;
  --good:#6bd39b; --good-soft:#163428; --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152124; --surface-2:#1b2a2e; --ink:#e4edef; --muted:#93a7ad; --line:#26383c;
  --accent:#5fc2ca; --accent-ink:#06282b; --accent-soft:#17363a;
  --good:#6bd39b; --good-soft:#163428; --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}

header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px}
.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.hero-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.brand b{font-family:var(--font-display);font-size:16px;display:block}
.brand span{font-size:12px;color:var(--muted)}
nav.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;align-items:center}
nav.nav a{padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500;font-size:14px}
nav.nav a:hover{background:var(--surface-2);color:var(--ink)}
nav.nav a.on{background:var(--accent-soft);color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 50px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tile{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .lab{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.good .val{color:var(--good)} .tile.bad .val{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--surface-2);color:var(--muted)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input[type=text],input[type=date],input[type=month],input[type=search],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fgrid .full{grid-column:1/-1}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
td input{padding:5px 7px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .main{flex:1;min-width:0} .li .t{font-weight:600} .li .s{font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.hero h1{font-size:32px}
.hero .lead{font-size:16px;color:var(--muted);margin-top:10px;max-width:60ch}
.hero-side{background:var(--accent-soft);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero-side div{display:flex;gap:8px}
.hero-side b{min-width:100px;white-space:nowrap;color:var(--accent);font-weight:600}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:20px}.hero h1{font-size:26px}}
.article-card{cursor:pointer;text-decoration:none;color:var(--ink)}
.article-card:hover{border-color:var(--accent)}
.article-card .tag{font-size:12px;color:var(--accent);font-weight:600}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px;font-size:16px}
.prose h2{font-size:20px;margin-top:10px} .prose h3{font-size:17px;margin-top:6px}
.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}
.article-card{padding:0;overflow:hidden;gap:0}
.article-card .ac-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.article-card .cover{border-radius:0}
.prose figure{margin:6px 0;display:flex;flex-direction:column;gap:6px}
.prose figure img{width:100%;border-radius:8px;border:1px solid var(--line)}
.prose figcaption{font-size:13px;color:var(--muted);text-align:center}
.price-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;border:1px solid var(--line)}
.tile .tile-img{width:calc(100% + 32px);max-width:none;margin:-14px -16px 8px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r) var(--r) 0 0;display:block}
.note-box{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.price-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.price-row:last-child{border-bottom:none}
.price-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;background:var(--surface-2);padding:12px 14px;border-radius:8px}
.totals .r{text-align:right;font-variant-numeric:tabular-nums}
.totals .big{font-weight:700;font-size:16px}
.lock{max-width:440px;margin:40px auto}
.wall{position:relative;text-align:center;align-items:center;padding:36px 24px 44px}
.wall .wall-ic{width:52px;height:52px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
.wall .wall-ic svg{width:26px;height:26px}
.wall h2{font-size:19px}
.wall .pinbox{width:100%;max-width:280px;margin-top:6px;text-align:left}
.secret{position:absolute;right:12px;bottom:10px;border:none;background:transparent;color:var(--muted);opacity:.28;font-size:13px;padding:6px;cursor:default;line-height:1;user-select:none;-webkit-tap-highlight-color:transparent}
.secret:focus-visible{opacity:1}

.ov{position:fixed;inset:0;background:rgba(8,20,24,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{max-width:960px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px}
footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--muted)}
.hide{display:none!important}

/* In phiếu thu */
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;padding:10mm;color:#000;background:#fff;font-size:13px}
  #print h2{font-size:18px;margin-bottom:2px} #print table{width:100%;border-collapse:collapse;margin:10px 0}
  #print th,#print td{border-bottom:1px solid #999;padding:5px;background:none;color:#000}
  #print .r{text-align:right}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home"><div class="brand-mark" id="brandMark">HH</div><div><b id="brandName"></b><span id="brandSub"></span></div></a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main id="main"></main>
<footer><span>Thông tin trên trang chỉ để tham khảo, không thay thế việc thăm khám trực tiếp với bác sĩ.</span><a href="#tinh-tien">Khu bác sĩ</a></footer>
<div id="print"></div>
<div id="toast" aria-live="polite"></div>

<script src="data.js"></script>
<script>
/* ============ Tiện ích ============ */
const SITE=window.SITE||{},PRICES=window.PRICES||[],ARTICLES=window.ARTICLES||[];
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;
  if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='class')el.className=v;else if(k==='value')el.value=v;else if(k==='checked')el.checked=!!v;else el.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}
function toast(m){const t=h('div',null,m);$('#toast').append(t);setTimeout(()=>t.remove(),3000);}
const fmt=n=>(Math.round(Number(n)||0)).toLocaleString('vi-VN')+' đ';
const fmtShort=n=>{n=Number(n)||0;const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(1).replace('.0','')+' tỷ';if(a>=1e6)return (n/1e6).toFixed(1).replace('.0','')+' tr';if(a>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n));};
function parseMoney(s){if(typeof s==='number')return s;s=String(s||'').toLowerCase().replace(/\s+/g,'').replace(/vnđ|vnd|đồng|đ$/g,'');if(!s)return 0;
  let m=s.match(/^(\d+)(?:tr|triệu|m)(\d+)$/);if(m)return +m[1]*1e6+ +(m[2]+'000').slice(0,3)*1000;
  m=s.match(/^(\d+)(?:k|nghìn|ngàn)(\d+)$/);if(m)return +m[1]*1000+ +(m[2]+'00').slice(0,3);
  m=s.match(/^([\d.,]+)(k|nghìn|ngàn|tr|triệu|m|tỷ|ty)?$/);if(!m)return 0;let num=m[1],u=m[2];
  if(u){num=parseFloat(num.replace(',','.'));return Math.round(num*({k:1e3,'nghìn':1e3,'ngàn':1e3,tr:1e6,'triệu':1e6,m:1e6,'tỷ':1e9,ty:1e9}[u]));}
  if(/^\d{1,3}([.,]\d{3})+$/.test(num))return +num.replace(/[.,]/g,'');return Math.round(parseFloat(num.replace(',','.'))||0);}
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const fmtDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const monthOf=iso=>(iso||'').slice(0,7);
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LS={get(k,d){try{const v=localStorage.getItem('bshh:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('bshh:'+k,JSON.stringify(v));return true;}catch(e){toast('Trình duyệt không cho lưu dữ liệu');return false;}}};
const SS={get(k){try{return sessionStorage.getItem('bshh:'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem('bshh:'+k,v);}catch(e){}}};
function hashPin(p){let x=5381;for(const c of 'bshh|'+p)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36);}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Đã sao chép');}catch(e){const ta=h('textarea',{style:'position:fixed;opacity:0'},t);document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép');}catch(_){toast('Không sao chép được');}ta.remove();}}
function modal(title,body,foot,opts={}){const ov=h('div',{class:'ov'});const close=()=>ov.remove();
  ov.append(h('div',{class:'modal'+(opts.wide?' wide':''),role:'dialog','aria-label':title},h('div',{class:'modal-h'},h('h3',null,title),h('button',{class:'btn ghost sm',onclick:close},'Đóng')),h('div',{class:'modal-b'},body),foot?h('div',{class:'modal-f'},foot):null));
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close();});document.body.append(ov);return {close};}
function confirmBox(msg,ok,fn){const m=modal('Xác nhận',h('p',null,msg),[h('button',{class:'btn',onclick:()=>m.close()},'Hủy'),h('button',{class:'btn pri',onclick:()=>{m.close();fn();}},ok)]);}

/* ============ Dữ liệu tính tiền (lưu trong trình duyệt của máy này) ============ */
const D={services:LS.get('services',null),bills:LS.get('bills',[])};
if(!D.services){D.services=PRICES.map(p=>({id:uid(),name:p.name,group:p.group||'',unit:p.unit||'',price:+p.price||0,cost:0,public:true,note:p.note||'',image:p.image||''}));}
const saveServices=()=>LS.set('services',D.services);const saveBills=()=>LS.set('bills',D.bills);
const billCalc=b=>{const sub=(b.lines||[]).reduce((s,l)=>s+(+l.price||0)*(+l.qty||0),0);const cost=(b.lines||[]).reduce((s,l)=>s+(+l.cost||0)*(+l.qty||0),0);
  const disc=Math.min(sub,+b.discount||0);const total=sub-disc;const paid=(b.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);return {sub,cost,disc,total,paid,due:Math.max(0,total-paid),profit:total-cost};};

/* ============ Điều hướng ============ */
const ROUTES=[['home','Trang chủ'],['kien-thuc','Kiến thức'],['bang-gia','Bảng giá']];
const unlocked=()=>!!LS.get('pin',null)&&SS.get('ok')==='1';
function route(){const r=(location.hash||'#home').slice(1);if(r.startsWith('bai-'))return 'bai';return ['home','kien-thuc','bang-gia','tinh-tien'].includes(r)?r:'home';}
function applyBrand(){if(!SITE.logo)return;const m=$('#brandMark');if(m)m.replaceWith(h('img',{class:'brand-logo',src:SITE.logo,alt:SITE.name||''}));
  let l=document.querySelector('link[rel=icon]');if(!l){l=h('link',{rel:'icon'});document.head.append(l);}l.href=SITE.logo;}
function render(){const r=route();$('#brandName').textContent=SITE.name||'BS. Hà Hiếu';$('#brandSub').textContent=SITE.sub||'';
  const nav=$('#nav');nav.replaceChildren(...ROUTES.map(([k,l])=>h('a',{href:'#'+k,class:(r===k||(r==='bai'&&k==='kien-thuc'))?'on':''},l)));if(r==='tinh-tien'&&unlocked())nav.append(h('a',{href:'#tinh-tien',class:'on'},'Tính tiền'));
  const v={home:vHome,'kien-thuc':vArticles,bai:vArticle,'bang-gia':vPrices,'tinh-tien':vBilling}[r];
  $('#main').replaceChildren(...[].concat(v()));
  const a=r==='bai'?ARTICLES.find(x=>'bai-'+x.id===location.hash.slice(1)):null;document.title=a?a.title+' · '+(SITE.name||''):(SITE.name||'BS. Hà Hiếu')+' · Thẩm mỹ & Kiến thức';}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ============ Markdown đơn giản ============ */
